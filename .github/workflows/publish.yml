name: Publicar

# Renderiza o livro com os resultados congelados em _freeze/ (o CI não executa R)
# e publica no GitHub Pages. Configure o Pages em modo "GitHub Actions":
#   gh api -X PUT repos/<dono>/<repo>/pages -f build_type=workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.35

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Checagens antes do render
        run: python3 _extensions/felipelmc/course-notes/tools/check.py pre

      - name: Renderizar (usa _freeze; não executa R)
        run: |
          set -o pipefail
          quarto render 2>&1 | tee render.log

      - name: Checagens depois do render
        run: python3 _extensions/felipelmc/course-notes/tools/check.py post _book render.log

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
