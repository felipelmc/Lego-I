- file: aulas/aula-02.qmd
  before: '**DESENHOS DE PESQUISA EXPERIMENTAIS** A exposição de uma propaganda com conteúdo negativo sobre um candidato ($X$) pode, ou não, afetar a probabilidade do eleitor votar no candidato-alvo da propaganda ($Y$). É importante salientar que a afirmação causal possui um componente direcional específico; isto é, a exposição a propagandas aumentará as chances de o eleitor escolher o candidato que fez a propaganda. (p. 95) Nós, os pesquisadores, devemos não apenas controlar o valor da nossa variável independente [nesse caso, a exposição à propaganda], mas _devemos também atribuir esses valores aos participantes randomicamente_. No nosso anúncio de campanha, isso significa que devemos [...] usar um gerador de números randômicos ou algum outro mecanismo desse tipo para dividir nossos participantes em um **grupo de tratamento** (os que assistirão ao anúncio negativo) e um **grupo de controle** (os que não assistirão ao anúncio, mas algo diferente do tratamento, que nas ciências médicas é chamado de um **placebo**). (p. 96) De fato, desde que o número de participantes seja razoavelmente grande, a atribuição aleatória de participantes ao grupo de tratamento assegura que os grupos, no seu todo, seja _idênticos_. Se os dois grupos são idênticos, exceto pelo lançamento da moeda, então podemos ter certeza de que qualquer diferença que observarmos nos grupos deve se dar em razão da variável independente que atribuímos. (p 96) **Atribuição randômica** aos grupos de tratamento e controle ocorre quando os participantes de um experimento são atribuídos randomicamente a diferentes valores de $X$, a variável dependente. É importante observar que a definição não diz nada a respeito de como os indivíduos são selecionados para participar do experimento. Já a **amostra aleatória**, essencialmente, relaciona-se a como pesquisadores selecionam casos para os seus estudos -- eles são selecionados aleatoriamente, o que significa que cada membro da **população** em questão tem uma mesma probabilidade de ser selecionado. (p. 100) [Sobre a limitação de experimentos] Cientistas sociais não podem "atribuir" a pessoas uma identificação partidária ou uma renda, "atribuir" a um país um nível de democratização ou gasto miliar, [...]. Essas variáveis simplesmente existem na natureza e não podemos controlar a exposição a elas e atribuir randomicamente valores para diferentes casos (isto é, pessoas ou países). E, no entanto, cientistas sociais se sentem compelidos a estudar esses fenômenos, o que significa que, nessas circunstâncias, devemos empregar um desenho não experimental de pesquisa. (p. 102) [Experimentos não têm boa validade externa por usarem uma **amostra de conveniência**] Reiterando: _experimentos não requerem uma amostra que represente a população_. De fato, é extremamente rato que experimentos utilizem uma amostra da população. Em experimentos para teste de medicamentos, por exemplo, é comum o uso de anúncios em jornais ou em programas de rádio para convidar pessoas a participar, usualmente envolvendo alguma forma de compensação financeira.'
