- file: aulas/aula-02.qmd
  before: '**ESTUDOS OBSERVACIONAIS** Mas quais são as opções que estudiosos têm quando não podem controlar a exposição de diferentes valores das variáveis independentes? Em tais casos, a única escolha é recolher dados do mundo como eles são e realizar comparações entre unidades individuais -- como pessoas, partidos políticos ou países -- ou entre uma quantidade **agregada** que varia ao longo do tempo. (p. 105) Isso leva à definição de um estudo observacional: um estudo observacional é um desenho de pesquisa no qual o pesquisador não tem controle dos valores da variável independente, que ocorrem naturalmente. Todavia, é necessário que exista algum grau de variabilidade na variável independente entre os casos, assim como variação na variável dependente. (p. 105) [...] um estudo observacional transversal examina a realidade social transversalmente, focando a variação entre unidades espaciais individuais -- novamente, como cidadãos, políticos eleitos, distritos eleitorais ou países -- e a explicação da variação da variável dependente entre elas. (p. 109) [...] o estudo observacional de séries temporais que tem, em seu núcleo, a comparação ao longo do tempo de uma única unidade espacial. Diferentemente da variação transversal, na qual a relação examinada é entre unidades individuais tipicamente em um único ponto do tempo, em estudos observacionais de séries temporais cientistas políticos tipicamente examinam a variação dentro de uma unidade espacial ao longo do tempo. (p. 109) Como os exemplos anteriores demonstraram, quando precisamos controlar outras possíveis causas de $Y$ para superar o quarto obstáculo causal, precisamos controlar por _todas elas_, não por apenas uma. Mas como sabemos se controlamos por todas as possíveis causas de $Y$? Em muitos casos, não sabemos com certeza.'
